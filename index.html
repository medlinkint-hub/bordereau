<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>HWA Bordereau Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: fixed navy rail (desktop) / top tab bar (phone) + one working column; the run screen is a real 5-step sequence */
:root{
  --primary:#1a2f5e; --primary-ink:#ffffff; --accent:#c0392b;
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef2f8; --ink:#14203a; --muted:#5a6680; --line:#dce2ec;
  --ok:#1e7d4f; --ok-bg:#e3f4ea; --warn:#9a6700; --warn-bg:#fdf3d6; --bad:#b42318; --bad-bg:#fde8e6;
  --rail:#1a2f5e; --rail-ink:#dfe6f5; --rail-active:#ffffff;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#6f8fe0; --primary-ink:#0b1222; --accent:#e5675a;
  --bg:#0d1424; --surface:#151f36; --surface-2:#1c2843; --ink:#e6ebf5; --muted:#9aa6bf; --line:#2a3757;
  --ok:#57c98f; --ok-bg:#12301f; --warn:#e7b84a; --warn-bg:#33290f; --bad:#f08a80; --bad-bg:#3a1714;
  --rail:#0a1020; --rail-ink:#b9c4dc; --rail-active:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#6f8fe0; --primary-ink:#0b1222; --accent:#e5675a;
  --bg:#0d1424; --surface:#151f36; --surface-2:#1c2843; --ink:#e6ebf5; --muted:#9aa6bf; --line:#2a3757;
  --ok:#57c98f; --ok-bg:#12301f; --warn:#e7b84a; --warn-bg:#33290f; --bad:#f08a80; --bad-bg:#3a1714;
  --rail:#0a1020; --rail-ink:#b9c4dc; --rail-active:#ffffff; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* brand */
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;flex:none}
.brand-word{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand-word b{color:var(--accent);font-weight:700}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.rail .brand-word{color:#fff}
.rail nav{display:flex;flex-direction:column;gap:2px}
.navbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--rail-ink);font-weight:500}
.navbtn:hover{background:rgba(255,255,255,.07)}
.navbtn[aria-current="page"]{background:rgba(255,255,255,.12);color:var(--rail-active)}
.navbtn[aria-current="page"]::before{content:"";width:3px;height:16px;background:var(--accent);border-radius:2px;margin-left:-10px;margin-right:-3px}
.navbtn:focus-visible{outline:2px solid #fff}
.rail-foot{margin-top:auto;font-size:12px;opacity:.8;display:flex;flex-direction:column;gap:8px}
.rail-foot button{all:unset;cursor:pointer;color:#fff;font-weight:600;font-size:12.5px}
.main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead p{margin-top:4px}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.step{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start}
.step-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.step.done .step-n{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.step-body{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=month],input[type=number],input[type=email],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%;color:var(--ink)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:6px;font-weight:600;background:var(--primary);color:var(--primary-ink);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sec:hover{background:var(--surface-2);filter:none}
.btn.red{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);padding:6px 10px}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* insurer chooser */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* dropzone */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface-2)}
.drop.over{border-color:var(--primary)}
.drop .ico{width:38px;height:38px;flex:none;border-radius:8px;background:var(--surface);display:grid;place-items:center;border:1px solid var(--line)}
.file-ok{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.warn{background:var(--warn-bg);border-color:transparent}.stat.warn .v{color:var(--warn)}
.stat.bad{background:var(--bad-bg);border-color:transparent}.stat.bad .v{color:var(--bad)}
.stat.ok .v{color:var(--ok)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.map td{white-space:normal}
.map select,.map input[type=text]{padding:5px 8px;font-size:12.5px}
.map .col{font-family:var(--mono);font-size:12px;color:var(--muted)}
.flagrow td:first-child{border-left:3px solid var(--warn)}
.flagrow.bad td:first-child{border-left-color:var(--bad)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.card .meta{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted)}
.card .acts{display:flex;gap:8px;margin-top:auto;padding-top:6px}

.notice{border-radius:6px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--ink)}
.notice.info{background:var(--surface-2)}
.notice.bad{background:var(--bad-bg)}
.notice b{font-weight:600}
code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* lock */
.lock{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockbox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px 28px;display:flex;flex-direction:column;gap:18px}
.lockbox .pin{font-size:22px;letter-spacing:.4em;text-align:center;font-family:var(--mono)}
.lock-foot{font-size:12px;color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);padding:8px 12px;border-radius:6px;font-size:13px}

.hint{font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--primary)}
.sep{height:1px;background:var(--line);margin:4px 0}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:10px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;overflow-x:auto}
  .rail .brand-word{display:none}
  .rail nav{flex-direction:row}
  .navbtn{padding:7px 10px;font-size:13px}
  .navbtn[aria-current="page"]::before{display:none}
  .rail-foot{margin:0 0 0 auto;flex-direction:row}
  .rail-foot span{display:none}
  .main{padding-block:20px 60px}
}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.navbtn{transition:background .15s,filter .15s}}
</style>

<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.7/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.7/build/vfs_fonts.js"></script>

<script id="core">
/* ================= CORE (no DOM) ================= */
var CORE = (function(){
  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const norm=s=>String(s==null?"":s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9α-ω]+/g," ").trim();
  const SYN=[
    ["claim","case","ref","reference","file","claim no","case no","claim number","case number","claim ref","our ref","hwa ref"],
    ["policy","policy no","policy number","certificate","member id","membership"],
    ["patient","insured","member","name","patient name","insured name","beneficiary","surname"],
    ["dob","birth","date of birth","birthdate"],
    ["country","nationality","country of residence"],
    ["provider","hospital","clinic","facility","doctor"],
    ["admission","adm","date of service","service date","incident","occurrence","loss date","treatment date","admitted","date of loss"],
    ["discharge","disch","end date","discharged"],
    ["diagnosis","icd","icd10","icd 10","condition"],
    ["billed","invoice","invoice amount","gross","claimed","charged","original amount","total amount"],
    ["saving","savings","discount","reduction","cost containment"],
    ["payable","net","net amount","paid","settled","amount paid","approved"],
    ["status","case status","state"],
    ["currency","ccy","cur"],
    ["fee","handling fee","admin fee","tpa fee"],
    ["reserve","outstanding","estimate"]
  ];
  function groupOf(s){const n=norm(s);const toks=n.split(" ");let best=-1,bs=0;
    SYN.forEach((g,i)=>{g.forEach(w=>{const sc=(n===w)?3:(n.includes(w)&&w.length>3)?2:toks.includes(w)?1.5:0;if(sc>bs){bs=sc;best=i}})});return best}
  function autoMatch(header,fields){
    const h=norm(header);if(!h)return "";
    let best="",bs=0;const hg=groupOf(header);const ht=new Set(h.split(" "));
    fields.forEach(f=>{const n=norm(f);let sc=0;
      if(n===h)sc=10;else{
        const ft=n.split(" ");const ov=ft.filter(t=>ht.has(t)&&t.length>1).length;sc=ov*2;
        if(hg>=0&&groupOf(f)===hg)sc+=4;}
      if(sc>bs){bs=sc;best=f}});
    return bs>=4?best:"";
  }
  function colLetter(n){let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
  function letterToCol(L){let n=0;for(const ch of String(L).toUpperCase()){n=n*26+(ch.charCodeAt(0)-64)}return n}
  function pad(n){return String(n).padStart(2,"0")}
  function dOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
  function toDate(v){
    if(v==null||v==="")return null;
    if(v instanceof Date&&!isNaN(v)){const r=new Date(Math.round(v.getTime()/60000)*60000);return dOnly(r)}
    if(typeof v==="number"&&v>20000&&v<80000){const ms=Math.round((v-25569)*86400000);const u=new Date(ms);return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate())}
    const s=String(v).trim();let m;
    if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return mk(+m[1],+m[2],+m[3]);
    if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){let y=+m[3];if(y<100)y+=y>60?1900:2000;return mk(y,+m[2],+m[1])}
    return null;
    function mk(y,mo,d){if(mo<1||mo>12||d<1||d>31)return null;const r=new Date(y,mo-1,d);return r.getMonth()===mo-1?r:null}
  }
  function toNum(v){
    if(v==null||v==="")return null;
    if(typeof v==="number")return isFinite(v)?v:null;
    let s=String(v).trim().replace(/[€$£\s ]|EUR|USD|GBP|BGN|RON/gi,"");
    let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
    if(s.startsWith("-")){neg=!neg;s=s.slice(1)}
    if(!/^[\d.,]+$/.test(s))return null;
    const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
    if(lc>-1&&ld>-1){ if(lc>ld)s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");}
    else if(lc>-1){ const after=s.length-lc-1; if((s.match(/,/g)||[]).length===1&&after!==3)s=s.replace(",",".");else s=s.replace(/,/g,"");}
    else if(ld>-1){ const after=s.length-ld-1; if((s.match(/\./g)||[]).length>1||after===3)s=s.replace(/\./g,""); /* Greek thousands: 12.400 = 12400 */ }
    const n=parseFloat(s);if(isNaN(n))return null;return neg?-n:n;
  }
  const fmtDate=d=>d?pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear():"";
  const fmtMoney=n=>(n==null||n==="")?"":Number(n).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
  function periodLabel(ym){const[y,m]=ym.split("-").map(Number);return MONTHS[m-1]+" "+y}
  function monthRange(ym){const[y,m]=ym.split("-").map(Number);return{from:new Date(y,m-1,1),to:new Date(y,m,0)}}

  function cellText(v){
    if(v==null)return "";
    if(v instanceof Date)return fmtDate(v);
    if(typeof v==="object"){
      if(v.richText)return v.richText.map(t=>t.text).join("");
      if(v.text!=null)return String(v.text);
      if(v.result!=null)return String(v.result);
      if(v.formula)return "="+v.formula;
      return "";}
    return String(v);
  }
  function detectHeaderRow(rows){
    let best=0,bs=0;
    /* count distinct titles: merged group headings repeat one value across many cells */
    rows.slice(0,40).forEach((r,i)=>{const sc=new Set(r.filter(c=>{const t=String(c==null?"":c).trim();return t&&!t.includes("{{")&&isNaN(Number(t))&&!(c instanceof Date)}).map(c=>String(c).trim())).size;if(sc>bs){bs=sc;best=i}});
    return bs>=2?best:0;
  }
  /* aoa from SheetJS -> {headers, rows} */
  function parseSource(aoa){
    const hi=detectHeaderRow(aoa);
    const raw=(aoa[hi]||[]).map(h=>String(h==null?"":h).trim());
    const seen={};const headers=raw.map((h,i)=>{let k=h||("Column "+(i+1));if(seen[k]){seen[k]++;k=k+" ("+seen[k]+")"}else seen[k]=1;return k});
    const rows=[];
    for(let r=hi+1;r<aoa.length;r++){const a=aoa[r]||[];if(!a.some(c=>c!==""&&c!=null))continue;
      const o={_r:r+1};headers.forEach((h,i)=>{o[h]=a[i]==null?"":a[i]});rows.push(o)}
    return{headers,rows,headerRow:hi+1};
  }
  function isEmpty(v){return v==null||v===""||(typeof v==="string"&&!v.trim())}

  function computeRows(profile,src,ym){
    const specs=profile.columns||[];
    const{from,to}=monthRange(ym);
    const ctx={period:periodLabel(ym),from,to,insurer:profile.name,today:dOnly(new Date())};
    const missingFields=[...new Set(specs.filter(s=>s.mode==="field"&&s.source&&!src.headers.includes(s.source)).map(s=>s.source))];
    if(profile.periodField&&!src.headers.includes(profile.periodField))missingFields.push(profile.periodField);
    const flags=[];let outside=0,badDate=0;const used=[];
    src.rows.forEach(r=>{
      if(profile.periodField&&src.headers.includes(profile.periodField)){
        const d=toDate(r[profile.periodField]);
        if(!d){badDate++;flags.push({row:r._r,key:profile.keyField?r[profile.keyField]:"",level:"bad",issue:`"${profile.periodField}" is empty or not a date — row left out`});return}
        if(d<from||d>to){outside++;return}
      }
      used.push(r);
    });
    const out=[];const totals={};specs.forEach((s,i)=>{if(s.sum)totals[i]=0});
    const keyCount={};
    used.forEach((r,idx)=>{
      const key=profile.keyField?String(r[profile.keyField]==null?"":r[profile.keyField]).trim():"";
      if(key){keyCount[key]=(keyCount[key]||0)+1}
      const vals=specs.map((s,i)=>{
        let v=null;
        switch(s.mode){
          case"blank":v=null;break;
          case"const":v=s.value||"";break;
          case"seq":v=idx+1;break;
          case"period":v=ctx.period;break;
          case"insurer":v=profile.name;break;
          case"today":v=ctx.today;break;
          case"field":{
            const raw=s.source?r[s.source]:"";
            if(isEmpty(raw)){v=null}
            else if(s.fmt==="date"){const d=toDate(raw);if(!d)flags.push({row:r._r,key,level:"warn",issue:`${s.header}: "${raw}" is not a readable date — copied as text`});v=d||String(raw)}
            else if(s.fmt==="number"){const n=toNum(raw);if(n==null)flags.push({row:r._r,key,level:"warn",issue:`${s.header}: "${raw}" is not a number — copied as text`});v=n==null?String(raw):n}
            else if(s.fmt==="text"){v=raw instanceof Date?fmtDate(toDate(raw)):String(raw).trim()}
            else{v=raw instanceof Date?toDate(raw):(typeof raw==="string"?raw.trim():raw)}
            break}
        }
        if(s.required&&isEmpty(v))flags.push({row:r._r,key,level:"bad",issue:`${s.header} is empty (required)`});
        if(s.sum){const n=typeof v==="number"?v:toNum(v);if(n!=null)totals[i]+=n}
        return v;
      });
      out.push(vals);
    });

const ab2b64=buf=>{const b=new Uint8Array(buf);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const b642ab=s=>{const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b.buffer};
async function sha(t){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hwa-bdx:"+t));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;t.setAttribute("role","status");document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

async function saveFile(filename,blob){
  try{
    if(window.claude&&claude.use){const d=await claude.use("downloads");
      if(d){try{await d.save({filename,data:blob});toast("Saved "+filename)}catch(e){if(e&&e.code==="declined")toast("Download cancelled");else toast("Could not save the file here ("+(e&&e.code||"error")+").")}return}}
  }catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Saved "+filename);
}

let fbAuth=null;
function initAuth(){
  if(!authReady())return;
  try{firebase.initializeApp(AUTH.firebase);fbAuth=firebase.auth();fbAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});}catch(e){S.authMsg="Sign-in could not start: "+e.message;return}
  fbAuth.onAuthStateChanged(async u=>{
    if(u&&u.emailVerified&&emailAllowed(u.email)){S.user=u.email;S.authMsg="";}
    else{if(u){S.authMsg=`${u.email} is not on the list of approved accounts.`;try{await fbAuth.signOut()}catch(e){}}S.user=null;S.unlocked=false}
    render();
  });
}
async function googleSignIn(){try{await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){S.authMsg=e.code==="auth/popup-closed-by-user"?"":"Sign-in failed: "+(e.message||e.code);render()}}

async function boot(){
  S.pinHash=await Store.get("pinHash");
  S.profiles=(await Store.get("profiles"))||[];
  S.settings=Object.assign(S.settings,(await Store.get("settings"))||{});
  S.history=(await Store.get("history"))||[];
  initAuth();
  if(!S.profiles.length&&!(await Store.get("demoRemoved"))){await addDemo()}
  const old=S.profiles.find(p=>p.id==="sompo");
  if(old&&(old.presetVersion||1)<3){const np=C.sompoProfile();const keepA=(old.columns||[]).find(c=>c.letter==="A");const keepHints={};(old.columns||[]).forEach(c=>{if(c.hint)keepHints[c.letter]=c.hint});
    Object.assign(old,{columns:np.columns.map(c=>c.letter==="A"&&keepA?Object.assign(c,{value:keepA.value}):c),kpi:Object.assign({},np.kpi,old.kpi||{},{lob:"A&H",openBasis:(old.kpi&&old.kpi.openBasis)||"all"}),sourceFields:np.sourceFields,presetVersion:3,rules:null})}
  if(old&&false){const np=C.sompoProfile();const keepA=(old.columns||[]).find(c=>c.letter==="A");
    Object.assign(old,{columns:np.columns.map(c=>c.letter==="A"&&keepA?Object.assign(c,{value:keepA.value}):c),kpi:np.kpi,sourceFields:np.sourceFields,presetVersion:2});await saveProfiles()}
  if(!S.profiles.some(p=>p.id==="sompo")&&!(await Store.get("sompoRemoved"))){const sp=C.sompoProfile();sp.template=SOMPO_TPL;S.profiles.unshift(sp)}
  for(const p of S.profiles){if(p.kind==="kpi"&&p.template&&!p.rules){try{await learnProfile(p,false)}catch(e){console.error(e)}}}
  await saveProfiles();
  render();
}

function reviewBlock(p,res){
  const bad=res.flags.filter(f=>f.level==="bad").length,warn=res.flags.length-bad;
  const sumSpecs=p.columns.map((s,i)=>s.sum?[s,i]:null).filter(Boolean);

  const prev=res.out.slice(0,8);
  return`<section class="panel">
    <div class="step ${blocked?"":"done"}"><div class="step-n">4</div><div class="step-body">
      <h2>Check</h2>
      ${res.missingFields.length?`<div class="notice bad"><span><b>The file is missing column${res.missingFields.length>1?"s":""} the mapping needs:</b> ${res.missingFields.map(esc).join(", ")}. Check that this is the right export for ${esc(p.name)}, or update the insurer's mapping.</span></div>`:""}
      <div class="stats">
        <div class="stat"><span class="k">Rows in file</span><span class="v">${res.fileRows}</span></div>
        <div class="stat ${res.count?"ok":"bad"}"><span class="k">Cases in ${esc(res.ctx.period)}</span><span class="v">${res.count}</span></div>
        ${p.periodField?`<div class="stat"><span class="k">Outside month</span><span class="v">${res.outside}</span></div>`:""}
        ${sumSpecs.map(([s,i])=>`<div class="stat"><span class="k">${esc(s.header)}</span><span class="v">${C.fmtMoney(res.totals[i])}</span></div>`).join("")}
        <div class="stat ${bad?"bad":warn?"warn":"ok"}"><span class="k">Flags</span><span class="v">${res.flags.length}</span></div>
      </div>
      ${res.flags.length?`<div class="tbl-wrap" style="max-height:280px"><table><thead><tr><th>Row</th><th>Case</th><th>Issue</th><th></th></tr></thead><tbody>
        ${res.flags.map(f=>`<tr class="flagrow ${f.level}"><td class="num">${esc(f.row)}</td><td class="mono">${esc(f.key)}</td><td style="white-space:normal">${esc(f.issue)}</td><td><span class="pill ${f.level}">${f.level==="bad"?"Fix":"Check"}</span></td></tr>`).join("")}
      </tbody></table></div><p class="hint">Fix these in the smart program and export again, or download anyway if you have checked them.</p>`:`<div class="notice info"><span class="pill ok">No flags</span><span>Every required field is filled, numbers and dates read correctly, and no case number repeats.</span></div>`}
      ${prev.length?`<details><summary>Preview the first ${prev.length} rows as they will appear</summary><div class="tbl-wrap" style="margin-top:10px"><table><thead><tr>${p.columns.map(s=>`<th>${esc(s.header)}</th>`).join("")}</tr></thead><tbody>
        ${prev.map(r=>`<tr>${r.map((v,j)=>`<td class="${typeof v==="number"?"n":""}">${esc(showVal(v,p.columns[j]))}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`:""}
    </div></div>
  </section>
  <section class="panel">
    <div class="step"><div class="step-n">5</div><div class="step-body">
      <h2>Download</h2>
      <div class="row">
        <button class="btn" id="dlX" ${blocked?"disabled":""}>${ICON.xls} Bordereau (.xlsx)</button>
        <button class="btn sec" id="dlP" ${blocked?"disabled":""}>${ICON.pdf} PDF copy</button>
        ${bad&&!blocked?`<span class="pill bad">${bad} flag${bad>1?"s":""} to fix</span>`:""}
      </div>
      <label class="f">Remark <span style="font-weight:400">(optional — printed on the PDF, kept in History)</span><textarea id="caseNote" rows="2" style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;resize:vertical;color:var(--ink)">${esc(S.run.note)}</textarea></label>

async function readAoa(file){

}

  render()}

function R0note(){const t=(S.run.note||"").trim();return t?{margin:[0,12,0,0],stack:[{text:"Remarks",bold:true,color:"#1a2f5e",fontSize:9.5,margin:[0,0,0,3]},{text:t}]}:{text:""}}

      {table:{headerRows:1,widths:cols.map(()=>"auto"),body:[head,...body]},

  };

function bindEdit(){

      initial:$("#k_init").value,excess:$("#k_exc").value,saving:$("#k_sav").value,audit:$("#k_aud").value,authorized:$("#k_auth").value,benefit:$("#k_ben").value,reopenValues:$("#k_reo").value,staticDays:+$("#k_sd").value||90,nilDays:+$("#k_nd").value||60,lob:$("#k_lob").value,openBasis:$("#k_ob").value}}

  document.querySelectorAll("[data-kfill]").forEach(sl=>sl.onchange=()=>{pull();const c=p.columns[+sl.dataset.kfill];const v=sl.value;
    if(v.startsWith("m:")){c.mode="metric";c.metric=v.slice(2);c.fmt=C.METRICS[c.metric].fmt;c.suggest=""}else if(v.startsWith("s:")){c.mode="manual";c.suggest=v.slice(2);c.fmt=C.METRICS[c.suggest].fmt}else{c.mode=v;c.metric="";c.suggest="";if(v==="monthdate")c.fmt="date";if(v==="const"||v==="insurer")c.fmt="text"}render()});
  document.querySelectorAll("[data-kfmt]").forEach(sl=>sl.onchange=()=>{p.columns[+sl.dataset.kfmt].fmt=sl.value});
  document.querySelectorAll("[data-khint]").forEach(sl=>sl.oninput=()=>{p.columns[+sl.dataset.khint].hint=sl.value});
  const rebuildCols=()=>{const sh=E.sheets.find(s=>s.name===p.sheet)||E.sheets[0];p.sheet=sh.name;
    const old={};(p.columns||[]).forEach(c=>old[c.header]=c);

    p.columns=C.headersFromTemplate(sh,p.headerRow).map(h=>old[h.header]?Object.assign({},old[h.header],{col:h.col,letter:h.letter,group:grp[h.col-1]}):
      (p.kind==="kpi"?{...h,group:grp[h.col-1],mode:"manual",metric:"",source:"",value:"",fmt:"number",hint:"",required:false,pdf:true}:{...h,mode:"blank",source:"",value:"",fmt:"auto",required:false,sum:false,pdf:true}))};
  const tf=$("#tplFile");tf.onchange=async()=>{const f=tf.files[0];if(!f)return;pull();

  }
  const sf=$("#smpFile");if(sf)sf.onchange=async()=>{const f=sf.files[0];if(!f)return;pull();
    try{const src=C.parseSource(await readAoa(f));p.sourceFields=src.headers;if(p.kind!=="kpi")autoMapAll(true);toast(src.headers.length+" columns read from "+f.name);render()}catch(e){toast("Could not read "+f.name)}};
  $("#autoMap")&&($("#autoMap").onclick=()=>{pull();const n=autoMapAll(true);toast(n?n+" columns matched — please check them":"No new matches found");render()});
  document.querySelectorAll("[data-fill]").forEach(s=>s.onchange=()=>{pull();const c=p.columns[+s.dataset.fill];const v=s.value;
    if(v.startsWith("f:")){c.mode="field";c.source=v.slice(2);if(c.fmt==="auto")c.fmt=guessFmt(c.header,c.source)}else{c.mode=v;c.source=""}render()});
  document.querySelectorAll("[data-const]").forEach(s=>s.oninput=()=>{p.columns[+s.dataset.const].value=s.value});
  document.querySelectorAll("[data-fmt]").forEach(s=>s.onchange=()=>{p.columns[+s.dataset.fmt].fmt=s.value});
  [["req","required"],["sum","sum"],["pdf","pdf"]].forEach(([a,k])=>document.querySelectorAll(`[data-${a}]`).forEach(s=>s.onchange=()=>{p.columns[+s.dataset[a]][k]=s.checked}));
  $("#e_pf")&&($("#e_pf").onchange=()=>pull());$("#e_key")&&($("#e_key").onchange=()=>pull());
  $("#saveEd").onclick=async()=>{pull();
    if(!p.name){toast("Enter the insurance company name.");$("#e_name").focus();return}
    if(!p.template){toast("Upload the insurer's bordereau template first.");return}
    p.updated=Date.now();p.demo=p.demo&&!E.isNew;
    const i=S.profiles.findIndex(x=>x.id===p.id);if(i>=0)S.profiles[i]=p;else S.profiles.push(p);
    await saveProfiles();if(S.run.pid===p.id)recompute();toast("Saved "+p.name);S.edit=null;render();window.scrollTo(0,0)};
}
function guessFmt(h,s){const t=C.norm(h+" "+s);if(/date|dob|birth|adm|disch|ημερ/.test(t))return"date";if(/amount|eur|usd|total|paid|net|billed|invoice|saving|discount|fee|reserve|cost|ποσ/.test(t))return"number";return"text"}
function autoMapAll(onlyEmpty){
  const p=S.edit.p;let n=0;
  p.columns.forEach(c=>{if(onlyEmpty&&c.mode!=="blank")return;const m=C.autoMatch(c.header,p.sourceFields||[]);if(m){c.mode="field";c.source=m;if(c.fmt==="auto")c.fmt=guessFmt(c.header,m);
    if(c.fmt==="number"&&/total|payable|net|billed|paid|amount|saving/i.test(c.header))c.sum=true;n++}});
  const fs=p.sourceFields||[];
  if(!p.keyField){p.keyField=fs.find(f=>/case|claim|ref/i.test(f)&&/no|num|ref|id/i.test(f))||""}
  if(!p.periodField){p.periodField=fs.find(f=>/adm|service|incident|occurr/i.test(f)&&/date/i.test(f))||""}
  return n;
}

/* ---------- HISTORY ---------- */
function historyView(){
  return`<div class="pagehead"><div><h1>History</h1><p class="muted">Every bordereau downloaded on this computer: when, for whom, which month, how many cases and the totals. No patient data is kept.</p></div>
    ${S.history.length?`<button class="btn sec" id="expHist">Export log (.csv)</button>`:""}</div>
  ${S.history.length?`<div class="tbl-wrap"><table><thead><tr><th>Generated</th><th>Insurer</th><th>Month</th><th>File</th><th>Cases</th><th>Flags</th><th>Totals</th><th>Type</th><th>Remarks</th></tr></thead><tbody>
    ${S.history.map(h=>`<tr><td class="num">${new Date(h.ts).toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(h.insurer)}</td><td>${esc(C.periodLabel(h.ym))}</td><td class="mono">${esc(h.file)}</td><td class="n">${h.count}</td>
      <td>${h.flags?`<span class="pill warn">${h.flags}</span>`:`<span class="pill ok">0</span>`}</td><td class="small">${Object.entries(h.totals||{}).map(([k,v])=>`${esc(k)} ${String(h.kind).startsWith("kpi")?esc(v==null?"—":v):C.fmtMoney(v)}`).join("<br>")}</td><td><span class="pill neutral">${h.kind.toUpperCase()}</span></td><td class="small" style="white-space:normal;min-width:180px">${esc(h.remarks||"")}</td></tr>`).join("")}
  </tbody></table></div>`:`<div class="panel"><p class="muted">Nothing downloaded yet. Your first bordereau will appear here.</p></div>`}`;
}
function bindHistory(){
  $("#expHist")&&($("#expHist").onclick=()=>{const rows=[["Generated","Insurer","Month","Source file","Cases","Flags","Totals","Type","Remarks"],...S.history.map(h=>[new Date(h.ts).toISOString(),h.insurer,h.ym,h.file,h.count,h.flags,Object.entries(h.totals||{}).map(([k,v])=>k+": "+v).join("; "),h.kind,h.remarks||""])];
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");saveFile("bordereau-history.csv",new Blob(["﻿"+csv],{type:"text/csv"}))});
}

/* ---------- SETTINGS ---------- */
function settingsView(){
  const st=S.settings;
  return`<div class="pagehead"><div><h1>Settings</h1><p class="muted">Signature block, logo for the PDF, lock time and backups.</p></div></div>
  <section class="panel"><h2>PDF logo</h2>
    <p class="hint">The PDF ends with an empty line for the handler's name, signature and date, filled in by hand.</p>
    <div class="row"><div class="grow">${st.logo?`<img src="${st.logo}" alt="Current logo" style="max-height:44px">`:`<span class="muted small">No logo uploaded. The PDF shows the HealthWatch name in brand colours. Upload the official logo (PNG or JPG) from www.healthwatch.gr.</span>`}</div>
      <label class="btn sec" for="logoFile" tabindex="0">${st.logo?"Replace logo":"Upload logo"}</label><input type="file" id="logoFile" accept="image/png,image/jpeg" hidden>${st.logo?`<button class="btn ghost" id="rmLogo">Remove</button>`:""}</div>
    <div><button class="btn" id="saveSet">Save</button></div>
  </section>
  <section class="panel"><h2>Security</h2>
    <div class="row"><label class="f" style="width:200px">Lock after (minutes idle)<input type="number" min="1" max="240" id="s_lock" value="${st.lockMin}"></label>
    <label class="f" style="width:200px">New PIN<input type="password" inputmode="numeric" id="s_pin" maxlength="8" placeholder="4–8 digits"></label><div style="align-self:flex-end"><button class="btn sec" id="savePin">Change PIN</button></div></div>
    <div class="notice info small"><span>The PIN stops casual access on a shared computer. The real protection is that case files are read only in this browser and cleared from memory when the app locks; nothing is sent to a server.</span></div>
  </section>
  <section class="panel"><h2>Backup</h2>
    <p class="muted small">Insurer profiles and templates live in this browser only. Export a backup after every change and keep it on the HWA drive; import it on another computer to share the setup with a colleague.</p>
    <div class="row"><button class="btn sec" id="expCfg">Export backup (.json)</button><label class="btn sec" for="impCfg" tabindex="0">Import backup</label><input type="file" id="impCfg" accept=".json" hidden></div>
  </section>`;
}
function bindSettings(){
  const st=S.settings;
  $("#saveSet").onclick=async()=>{await Store.set("settings",st);toast("Settings saved")};
  $("#logoFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{st.logo=r.result;await Store.set("settings",st);render()};r.readAsDataURL(f)};
  $("#rmLogo")&&($("#rmLogo").onclick=async()=>{st.logo="";await Store.set("settings",st);render()});
  $("#s_lock").onchange=async e=>{st.lockMin=Math.max(1,+e.target.value||15);await Store.set("settings",st);bumpIdle();toast("Lock time saved")};
  $("#savePin").onclick=async()=>{const v=$("#s_pin").value.trim();if(!/^\d{4,8}$/.test(v)){toast("Use 4 to 8 digits.");return}S.pinHash=await sha(v);await Store.set("pinHash",S.pinHash);$("#s_pin").value="";toast("PIN changed")};
  $("#expCfg").onclick=()=>{const data={app:"hwa-bordereau",version:1,exported:new Date().toISOString(),profiles:S.profiles,settings:S.settings};
    saveFile("hwa-bordereau-backup-"+new Date().toISOString().slice(0,10)+".json",new Blob([JSON.stringify(data)],{type:"application/json"}))};
  $("#impCfg").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=="hwa-bordereau"||!Array.isArray(d.profiles))throw 0;
    const ids=new Set(S.profiles.map(p=>p.id));let added=0,upd=0;d.profiles.forEach(p=>{if(ids.has(p.id)){S.profiles[S.profiles.findIndex(x=>x.id===p.id)]=p;upd++}else{S.profiles.push(p);added++}});
    if(d.settings)S.settings=Object.assign(S.settings,d.settings);await saveProfiles();await Store.set("settings",S.settings);toast(`Imported: ${added} new, ${upd} updated`);render()}catch(err){toast("That file is not an HWA bordereau backup.")}};
}

boot();
</script>

</body></html>
